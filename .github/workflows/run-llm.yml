name: Run LLM (dispatcher)

# Dispatcher workflow. Resolves the requested model from models.json, then
# delegates to the engine-specific reusable workflow (vLLM / MLX / Ollama).
# This keeps each engine's runner selection, install, health checks and
# keep-alive logic separate and maintainable.

on:
  workflow_dispatch:
    inputs:
      model_key:
        description: "Model"
        required: true
        type: choice
        options:
          - qwen3.8-27b-uncensored-ollama
          - qwen3.8-27b-uncensored-gguf-ollama
          - qwen3.8-27b-uncensored-mlx
          - qwen2.5-1.5b-mlx-4bit
          - qwen3.8-27b-uncensored
          - qwen3.8-flash-next-uncensored
          - glm-5.3-flash-uncensored
          - gemma-4-26b-a4b-it-uncensored
        default: qwen3.8-27b-uncensored-ollama
      ttl_minutes:
        description: "Keep alive (min, max 360)"
        required: false
        type: number
        default: 360
      quick_run:
        description: "Quick 15-min smoke test"
        required: false
        type: boolean
        default: false
      advanced:
        description: "Advanced (optional): quant=... len=... mem=... args=..."
        required: false
        type: string
        default: ""
      quantization:
        description: "Quantization override (optional; also accepts quant=... in advanced)"
        required: false
        type: string
        default: ""

concurrency:
  group: llm-dee-${{ inputs.model_key }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve ${{ inputs.model_key }}
    runs-on: ubuntu-latest
    outputs:
      runner_labels: ${{ steps.resolve.outputs.runner_labels }}
      hf_repo: ${{ steps.resolve.outputs.hf_repo }}
      engine_version: ${{ steps.resolve.outputs.engine_version }}
      served_model_name: ${{ steps.resolve.outputs.served_model_name }}
      resolved_quantization: ${{ steps.resolve.outputs.resolved_quantization }}
      device: ${{ steps.resolve.outputs.device }}
      engine: ${{ steps.resolve.outputs.engine }}
      engine_args: ${{ steps.resolve.outputs.engine_args }}
      model_env_json: ${{ steps.resolve.outputs.model_env_json }}
      quantization: ${{ steps.adv.outputs.quantization }}
      max_model_len: ${{ steps.adv.outputs.max_model_len }}
      gpu_memory_utilization: ${{ steps.adv.outputs.gpu_memory_utilization }}
      extra_args: ${{ steps.adv.outputs.extra_args }}
      ttl_minutes: ${{ steps.ttl.outputs.minutes }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog
        run: python3 scripts/validate_catalog.py

      - name: Parse advanced options
        id: adv
        env:
          ADVANCED: ${{ inputs.advanced }}
        run: |
          quant="${{ inputs.quantization }}"
          len="0"; mem="0"; args=""
          for tok in $ADVANCED; do
            case "$tok" in
              quant=*) quant="${tok#quant=}" ;;
              len=*)   len="${tok#len=}" ;;
              mem=*)   mem="${tok#mem=}" ;;
              args=*)  args="${tok#args=}" ;;
              *)       args="${args:+$args }$tok" ;;
            esac
          done
          {
            echo "quantization=$quant"
            echo "max_model_len=${len:-0}"
            echo "gpu_memory_utilization=${mem:-0}"
            echo "extra_args=$args"
          } >> "$GITHUB_OUTPUT"
          echo "parsed: quant='$quant' len='$len' mem='$mem' args='$args'"

      - name: Detect accelerator
        id: det
        run: bash scripts/detect_accel.sh

      - name: Resolve model config
        id: resolve
        uses: ./.github/actions/resolve-model
        with:
          model_key: ${{ inputs.model_key }}
          quantization: ${{ steps.adv.outputs.quantization }}
          max_model_len: ${{ steps.adv.outputs.max_model_len }}
          gpu_memory_utilization: ${{ steps.adv.outputs.gpu_memory_utilization }}
          extra_args: ${{ steps.adv.outputs.extra_args }}
          device: ${{ steps.det.outputs.device }}

      - name: Compute effective TTL
        id: ttl
        run: |
          if [[ "${{ inputs.quick_run }}" == "true" ]]; then
            echo "minutes=15" >> "$GITHUB_OUTPUT"
            echo "quick_run: TTL forced to 15m"
          else
            ttl="${{ inputs.ttl_minutes }}"
            if [[ "$ttl" -gt 360 ]]; then
              echo "::warning::ttl ${ttl}m exceeds GitHub's 360m job cap — clamping to 360"
              ttl=360
            fi
            echo "minutes=${ttl}" >> "$GITHUB_OUTPUT"
          fi

  serve-vllm:
    name: vLLM
    needs: resolve
    if: ${{ needs.resolve.outputs.engine == 'vllm' }}
    uses: ./.github/workflows/serve-vllm.yml
    with:
      model_key: ${{ inputs.model_key }}
      quantization: ${{ needs.resolve.outputs.quantization }}
      max_model_len: ${{ needs.resolve.outputs.max_model_len }}
      gpu_memory_utilization: ${{ needs.resolve.outputs.gpu_memory_utilization }}
      extra_args: ${{ needs.resolve.outputs.extra_args }}
      ttl_minutes: ${{ needs.resolve.outputs.ttl_minutes }}
      quick_run: ${{ inputs.quick_run }}
      runner_labels: ${{ needs.resolve.outputs.runner_labels }}
      device: ${{ needs.resolve.outputs.device }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}

  serve-mlx:
    name: MLX
    needs: resolve
    if: ${{ needs.resolve.outputs.engine == 'mlx' }}
    uses: ./.github/workflows/serve-mlx.yml
    with:
      model_key: ${{ inputs.model_key }}
      quantization: ${{ needs.resolve.outputs.quantization }}
      max_model_len: ${{ needs.resolve.outputs.max_model_len }}
      gpu_memory_utilization: ${{ needs.resolve.outputs.gpu_memory_utilization }}
      extra_args: ${{ needs.resolve.outputs.extra_args }}
      ttl_minutes: ${{ needs.resolve.outputs.ttl_minutes }}
      quick_run: ${{ inputs.quick_run }}
      runner_labels: ${{ needs.resolve.outputs.runner_labels }}
      device: ${{ needs.resolve.outputs.device }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}

  serve-ollama:
    name: Ollama
    needs: resolve
    if: ${{ needs.resolve.outputs.engine == 'ollama' }}
    uses: ./.github/workflows/serve-ollama.yml
    with:
      model_key: ${{ inputs.model_key }}
      quantization: ${{ needs.resolve.outputs.quantization }}
      max_model_len: ${{ needs.resolve.outputs.max_model_len }}
      gpu_memory_utilization: ${{ needs.resolve.outputs.gpu_memory_utilization }}
      extra_args: ${{ needs.resolve.outputs.extra_args }}
      ttl_minutes: ${{ needs.resolve.outputs.ttl_minutes }}
      quick_run: ${{ inputs.quick_run }}
      runner_labels: ${{ needs.resolve.outputs.runner_labels }}
      device: ${{ needs.resolve.outputs.device }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
