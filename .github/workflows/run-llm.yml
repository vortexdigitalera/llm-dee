name: Run LLM (vLLM / MLX / Ollama + Cloudflare tunnel)

# Core engine workflow. Runs on GitHub-hosted ubuntu-latest (Ollama CPU) or a
# self-hosted GPU/macOS runner. Detects the accelerator, deploys the selected
# engine (vLLM on CUDA, MLX on Apple Silicon, Ollama for GGUF on CPU/GPU),
# caches the HF weights for reuse, and exposes a public OpenAI-compatible
# endpoint (plus Ollama native REST /api/* when using the Ollama engine) via a
# Cloudflare quick tunnel (no Argo, no account, no token).

on:
  workflow_dispatch:
    inputs:
      model_key:
        description: "Model"
        required: true
        type: choice
        options:
          - qwen3.8-27b-uncensored-ollama
          - qwen3.8-27b-uncensored-gguf-ollama
          - qwen3.8-27b-uncensored-mlx
          - qwen2.5-1.5b-mlx-4bit
          - qwen3.8-27b-uncensored
          - qwen3.8-flash-next-uncensored
          - glm-5.3-flash-uncensored
          - gemma-4-26b-a4b-it-uncensored
        default: qwen3.8-27b-uncensored-ollama
      ttl_minutes:
        description: "Keep alive (min, max 360)"
        required: false
        type: number
        default: 360
      quick_run:
        description: "Quick 15-min smoke test"
        required: false
        type: boolean
        default: false
      advanced:
        description: "Advanced (optional): quant=... len=... args=..."
        required: false
        type: string
        default: ""

concurrency:
  group: llm-dee-${{ inputs.model_key }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  serve:
    name: Serve ${{ inputs.model_key }}
    runs-on: ubuntu-latest
    timeout-minutes: 390
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      TUNNEL_PUBLIC_HOSTNAME: ${{ vars.TUNNEL_PUBLIC_HOSTNAME }}
      HF_HOME: /tmp/llm-dee-hf-cache
    steps:
      - uses: actions/checkout@v4

      - name: Detect accelerator
        id: det
        run: bash scripts/detect_accel.sh

      - name: Validate catalog
        run: python3 scripts/validate_catalog.py

      - name: Parse advanced options
        id: adv
        env:
          ADVANCED: ${{ inputs.advanced }}
        run: |
          # Parse "quant=fp8 len=8192 args=--foo bar" from the single advanced field.
          quant=""; len="0"; args=""
          for tok in $ADVANCED; do
            case "$tok" in
              quant=*) quant="${tok#quant=}" ;;
              len=*)   len="${tok#len=}" ;;
              args=*)  args="${tok#args=}" ;;
              *)       args="${args:+$args }$tok" ;;  # bare tokens -> extra args
            esac
          done
          {
            echo "quantization=$quant"
            echo "max_model_len=${len:-0}"
            echo "extra_args=$args"
          } >> "$GITHUB_OUTPUT"
          echo "parsed: quant='$quant' len='$len' args='$args'"

      - name: Resolve model config
        id: resolve
        uses: ./.github/actions/resolve-model
        with:
          model_key: ${{ inputs.model_key }}
          quantization: ${{ steps.adv.outputs.quantization }}
          max_model_len: ${{ steps.adv.outputs.max_model_len }}
          extra_args: ${{ steps.adv.outputs.extra_args }}
          device: ${{ steps.det.outputs.device }}

      - name: Restore HF cache
        uses: actions/cache@v4
        with:
          path: /tmp/llm-dee-hf-cache
          key: hf-${{ steps.resolve.outputs.hf_repo }}-${{ steps.resolve.outputs.resolved_quantization }}-v1
          restore-keys: |
            hf-${{ steps.resolve.outputs.hf_repo }}-
            hf-

      - name: Start LLM server
        run: |
          mkdir -p state
          if [[ "${{ inputs.quick_run }}" == "true" ]]; then
            echo "quick_run: skipping in-runner warmup"
            export SKIP_WARMUP=1
          fi
          export ENGINE="${{ steps.resolve.outputs.engine }}"
          bash scripts/serve.sh

      - name: Start Cloudflare quick tunnel
        id: tunnel
        env:
          SERVED_MODEL_NAME: ${{ steps.resolve.outputs.served_model_name }}
          HF_REPO: ${{ steps.resolve.outputs.hf_repo }}
          RESOLVED_QUANTIZATION: ${{ steps.resolve.outputs.resolved_quantization }}
        run: bash scripts/start_tunnel.sh

      - name: External probe through tunnel
        if: ${{ inputs.quick_run != true }}
        run: |
          URL="${{ steps.tunnel.outputs.endpoint_url }}"
          # In named-tunnel service mode there is no scraped URL unless a public
          # hostname was configured in the dashboard — skip the probe then.
          if [[ "$URL" != http* ]]; then
            echo "no public URL to probe (named-tunnel service mode) — skipping"
            exit 0
          fi
          ENDPOINT_URL="$URL" \
          SERVED_MODEL_NAME="${{ steps.resolve.outputs.served_model_name }}" \
            bash scripts/probe.sh

      - name: Compute effective TTL
        id: ttl
        run: |
          if [[ "${{ inputs.quick_run }}" == "true" ]]; then
            echo "minutes=15" >> "$GITHUB_OUTPUT"
            echo "quick_run: TTL forced to 15m"
          else
            ttl="${{ inputs.ttl_minutes }}"
            # GitHub hard-caps a hosted job at 6h (360m). Clamp so the run
            # shuts down cleanly and the keepalive can re-dispatch, instead of
            # being killed abruptly by the platform.
            if [[ "$ttl" -gt 360 ]]; then
              echo "::warning::ttl ${ttl}m exceeds GitHub's 360m job cap — clamping to 360"
              ttl=360
            fi
            echo "minutes=${ttl}" >> "$GITHUB_OUTPUT"
          fi

      - name: Connection info
        run: |
          URL="$(cat state/endpoint_url 2>/dev/null || echo '${{ vars.TUNNEL_PUBLIC_HOSTNAME }}')"
          {
            echo ""
            echo "## ✅ Endpoint is live"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Landing / log viewer** | ${URL}/ |"
            echo "| **Base URL** | \`${URL}\` |"
            echo "| **OpenAI API** | \`${URL}/v1\` |"
            echo "| **Chat** | \`POST ${URL}/v1/chat/completions\` |"
            echo "| **Models** | \`GET ${URL}/v1/models\` |"
            if [[ "${{ steps.resolve.outputs.engine }}" == "ollama" ]]; then
              echo "| **Ollama REST** | \`POST ${URL}/api/chat\` &middot; \`POST ${URL}/api/generate\` &middot; \`GET ${URL}/api/tags\` |"
              echo "| **Tool calling** | \`tools\` field in /v1/chat/completions & /api/chat |"
            fi
            echo "| **Logs** | \`${URL}/logs\` |"
            echo "| **Model** | \`${{ steps.resolve.outputs.served_model_name }}\` |"
            echo "| **HF repo** | \`${{ steps.resolve.outputs.hf_repo }}\` |"
            echo "| **Backend** | ${{ steps.det.outputs.device }} / ${{ steps.resolve.outputs.engine }} |"
            echo "| **TTL** | ${{ steps.ttl.outputs.minutes }} min |"
            echo ""
            echo '```bash'
            echo "curl ${URL}/v1/chat/completions -H 'Content-Type: application/json' \\"
            echo "  -d '{\"model\":\"${{ steps.resolve.outputs.served_model_name }}\",\"messages\":[{\"role\":\"user\",\"content\":\"hello\"}]}'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Also echo a compact table into the log for quick scanning.
          echo "::notice title=LLM endpoint::${URL}/v1  (landing: ${URL}/)"
          echo "┌──────────────────────────────────────────────────────────"
          echo "│ Endpoint live"
          echo "│   landing : ${URL}/"
          echo "│   api     : ${URL}/v1"
          if [[ "${{ steps.resolve.outputs.engine }}" == "ollama" ]]; then
            echo "│   rest    : ${URL}/api"
          fi
          echo "│   logs    : ${URL}/logs"
          echo "│   model   : ${{ steps.resolve.outputs.served_model_name }}"
          echo "└──────────────────────────────────────────────────────────"

      - name: Keep alive for ${{ steps.ttl.outputs.minutes }} minutes
        env:
          ENGINE: ${{ steps.resolve.outputs.engine }}
        run: |
          ENDPOINT_URL="$(cat state/endpoint_url)"
          # Engine-aware PID/log filenames (ollama vs vllm/mlx)
          if [[ "$ENGINE" == "ollama" ]]; then
            SERVER_PID_FILE=state/ollama.pid
            SERVER_LOG=ollama.log
          else
            SERVER_PID_FILE=state/vllm.pid
            SERVER_LOG=vllm.log
          fi
          echo "Endpoint ${ENDPOINT_URL} alive for ${{ steps.ttl.outputs.minutes }}m"
          deadline=$(( $(date +%s) + ${{ steps.ttl.outputs.minutes }} * 60 ))
          while [[ $(date +%s) -lt $deadline ]]; do
            if ! kill -0 "$(cat "$SERVER_PID_FILE")" 2>/dev/null; then
              echo "::error::server died during keep-alive"; tail -n 100 "$SERVER_LOG"; exit 1
            fi
            if ! kill -0 "$(cat state/landing.pid)" 2>/dev/null; then
              echo "::error::landing proxy died during keep-alive"; tail -n 50 landing.log; exit 1
            fi
            cf_pid="$(cat state/cloudflared.pid)"
            if [[ "$cf_pid" == "service" ]]; then
              # named-tunnel service mode: check the service is still up
              if [[ "$(uname -s)" == "Darwin" ]]; then
                sudo launchctl list 2>/dev/null | grep -q cloudflared || { echo "::error::cloudflared service not running"; exit 1; }
              else
                systemctl is-active --quiet cloudflared || { echo "::error::cloudflared service not active"; exit 1; }
              fi
            elif ! kill -0 "$cf_pid" 2>/dev/null; then
              echo "::error::cloudflared died during keep-alive"; tail -n 50 cloudflared.log; exit 1
            fi
            sleep 30
          done
          echo "TTL reached — shutting down"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.model_key }}-${{ github.run_id }}
          path: |
            vllm.log
            ollama.log
            cloudflared.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop services
        if: always()
        run: bash scripts/stop.sh
