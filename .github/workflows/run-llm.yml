name: Run LLM (vLLM + Cloudflare quick tunnel)

# Core engine workflow. Runs entirely on GitHub-hosted macos-latest.
# Detects the accelerator on the runner (Apple Silicon / Metal), deploys vLLM,
# caches the HF weights for reuse, and exposes a public OpenAI-compatible
# endpoint via a Cloudflare quick tunnel (no Argo, no account, no token).

on:
  workflow_dispatch:
    inputs:
      model_key:
        description: "Model (key from models.json)"
        required: true
        type: choice
        options:
          - qwen2.5-1.5b-mlx-4bit
          - qwen3.8-27b-uncensored
          - qwen3.8-flash-next-uncensored
          - glm-5.3-flash-uncensored
          - gemma-4-26b-a4b-it-uncensored
        default: qwen2.5-1.5b-mlx-4bit
      quantization:
        description: "Quantization (empty = catalog default for the model)"
        required: false
        type: choice
        options:
          - ""
          - bf16
          - fp8
          - nvfp4
          - int8
        default: ""
      max_model_len:
        description: "Override max context length (0 = catalog default)"
        required: false
        type: number
        default: 0
      ttl_minutes:
        description: "Keep the endpoint alive this long, then auto-stop (GitHub caps a job at 360 = 6h)"
        required: false
        type: number
        default: 360
      quick_run:
        description: "Quick run — skip warmup & external probe, force 15-min TTL (fast smoke test)"
        required: false
        type: boolean
        default: false
      extra_args:
        description: "Extra raw vLLM args, e.g. --enable-prefix-caching --max-num-seqs 64"
        required: false
        type: string
        default: ""

concurrency:
  group: llm-dee-${{ inputs.model_key }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  serve:
    name: Serve ${{ inputs.model_key }}
    runs-on: macos-latest
    timeout-minutes: 390
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      HF_HOME: /tmp/llm-dee-hf-cache
    steps:
      - uses: actions/checkout@v4

      - name: Detect accelerator
        id: det
        run: bash scripts/detect_accel.sh

      - name: Validate catalog
        run: python3 scripts/validate_catalog.py

      - name: Resolve model config
        id: resolve
        uses: ./.github/actions/resolve-model
        with:
          model_key: ${{ inputs.model_key }}
          quantization: ${{ inputs.quantization }}
          max_model_len: ${{ inputs.max_model_len }}
          extra_args: ${{ inputs.extra_args }}
          device: ${{ steps.det.outputs.device }}

      - name: Restore HF cache
        uses: actions/cache@v4
        with:
          path: /tmp/llm-dee-hf-cache
          key: hf-${{ steps.resolve.outputs.hf_repo }}-${{ steps.resolve.outputs.resolved_quantization }}-v1
          restore-keys: |
            hf-${{ steps.resolve.outputs.hf_repo }}-
            hf-

      - name: Start vLLM
        run: |
          mkdir -p state
          if [[ "${{ inputs.quick_run }}" == "true" ]]; then
            echo "quick_run: skipping in-runner warmup"
            export SKIP_WARMUP=1
          fi
          bash scripts/serve.sh

      - name: Start Cloudflare quick tunnel
        id: tunnel
        run: bash scripts/start_tunnel.sh

      - name: External probe through tunnel
        if: ${{ inputs.quick_run != true }}
        run: |
          ENDPOINT_URL="${{ steps.tunnel.outputs.endpoint_url }}" \
          SERVED_MODEL_NAME="${{ steps.resolve.outputs.served_model_name }}" \
            bash scripts/probe.sh

      - name: Compute effective TTL
        id: ttl
        run: |
          if [[ "${{ inputs.quick_run }}" == "true" ]]; then
            echo "minutes=15" >> "$GITHUB_OUTPUT"
            echo "quick_run: TTL forced to 15m"
          else
            ttl="${{ inputs.ttl_minutes }}"
            # GitHub hard-caps a hosted job at 6h (360m). Clamp so the run
            # shuts down cleanly and the keepalive can re-dispatch, instead of
            # being killed abruptly by the platform.
            if [[ "$ttl" -gt 360 ]]; then
              echo "::warning::ttl ${ttl}m exceeds GitHub's 360m job cap — clamping to 360"
              ttl=360
            fi
            echo "minutes=${ttl}" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep alive for ${{ steps.ttl.outputs.minutes }} minutes
        run: |
          ENDPOINT_URL="$(cat state/endpoint_url)"
          echo "Endpoint ${ENDPOINT_URL} alive for ${{ steps.ttl.outputs.minutes }}m"
          deadline=$(( $(date +%s) + ${{ steps.ttl.outputs.minutes }} * 60 ))
          while [[ $(date +%s) -lt $deadline ]]; do
            if ! kill -0 "$(cat state/vllm.pid)" 2>/dev/null; then
              echo "::error::vLLM died during keep-alive"; tail -n 100 vllm.log; exit 1
            fi
            if ! kill -0 "$(cat state/cloudflared.pid)" 2>/dev/null; then
              echo "::error::cloudflared died during keep-alive"; tail -n 50 cloudflared.log; exit 1
            fi
            sleep 30
          done
          echo "TTL reached — shutting down"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.model_key }}-${{ github.run_id }}
          path: |
            vllm.log
            cloudflared.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop services
        if: always()
        run: bash scripts/stop.sh
