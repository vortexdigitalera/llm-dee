name: Resolve model from catalog

description: >-
  Reads models.json and exports the selected model's engine, runner labels,
  HF repo / Ollama tag, engine flags, env vars and other launch config as
  step outputs and $GITHUB_ENV.

inputs:
  model_key:
    description: "Key of the model in models.json"
    required: true
  quantization:
    description: "Requested quantization (empty = catalog default)"
    required: false
    default: ""
  max_model_len:
    description: "Override max context length (0 = use catalog default)"
    required: false
    default: "0"
  gpu_memory_utilization:
    description: "Override GPU memory utilization (0 = use catalog default)"
    required: false
    default: "0"
  extra_args:
    description: "Extra raw engine CLI args appended last"
    required: false
    default: ""
  device:
    description: "Target accelerator (cuda|metal|cpu); empty = cuda"
    required: false
    default: ""

outputs:
  runner_labels:
    description: "JSON array of runner labels for runs-on"
    value: ${{ steps.resolve.outputs.runner_labels }}
  hf_repo:
    description: "Resolved Hugging Face repo id or Ollama tag"
    value: ${{ steps.resolve.outputs.hf_repo }}
  engine_version:
    description: "Pinned engine version (vLLM, mlx-lm, or Ollama installer)"
    value: ${{ steps.resolve.outputs.engine_version }}
  served_model_name:
    description: "Served model name"
    value: ${{ steps.resolve.outputs.served_model_name }}
  resolved_quantization:
    description: "Resolved quantization key"
    value: ${{ steps.resolve.outputs.resolved_quantization }}
  device:
    description: "Target accelerator"
    value: ${{ steps.resolve.outputs.device }}
  engine:
    description: "Serving engine (vllm|mlx|ollama)"
    value: ${{ steps.resolve.outputs.engine }}
  engine_args:
    description: "Resolved engine CLI args (for vLLM/MLX)"
    value: ${{ steps.resolve.outputs.engine_args }}
  model_env_json:
    description: "Per-model env vars as JSON"
    value: ${{ steps.resolve.outputs.model_env_json }}

  # Backward-compatible aliases
  vllm_version:
    description: "Deprecated alias for engine_version"
    value: ${{ steps.resolve.outputs.engine_version }}

runs:
  using: composite
  steps:
    - name: Resolve model configuration
      id: resolve
      shell: bash
      env:
        INPUT_MODEL_KEY: ${{ inputs.model_key }}
        INPUT_QUANTIZATION: ${{ inputs.quantization }}
        INPUT_MAX_MODEL_LEN: ${{ inputs.max_model_len }}
        INPUT_GPU_MEM_UTIL: ${{ inputs.gpu_memory_utilization }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra_args }}
        INPUT_DEVICE: ${{ inputs.device }}
        CATALOG_PATH: ${{ github.workspace }}/models.json
      run: python3 "${{ github.workspace }}/scripts/resolve_model.py"
